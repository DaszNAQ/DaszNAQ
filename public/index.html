<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Developer Zodiac</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg0: #07060c;
        --bg1: #1a1230;
        --ink: #f4efe8;
        --muted: #b7a899;
        --accent: #e2b36a;
        --line: rgba(244, 239, 232, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        color: var(--ink);
        font-family: "Source Serif 4", Georgia, serif;
        background:
          radial-gradient(1200px 700px at 75% 20%, rgba(226, 179, 106, 0.16), transparent 55%),
          radial-gradient(900px 600px at 15% 80%, rgba(90, 140, 180, 0.14), transparent 50%),
          linear-gradient(160deg, var(--bg0), var(--bg1) 55%, #0b1822);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, 0.7), transparent),
          radial-gradient(1px 1px at 28% 62%, rgba(255, 255, 255, 0.45), transparent),
          radial-gradient(1.5px 1.5px at 63% 24%, rgba(255, 255, 255, 0.65), transparent),
          radial-gradient(1px 1px at 81% 71%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(1px 1px at 44% 38%, rgba(255, 255, 255, 0.35), transparent);
        opacity: 0.7;
      }

      main {
        position: relative;
        max-width: 920px;
        margin: 0 auto;
        padding: clamp(2.5rem, 8vw, 5.5rem) 1.25rem 4rem;
      }

      .brand {
        font-family: Cinzel, Georgia, serif;
        font-size: clamp(2.4rem, 7vw, 4.4rem);
        letter-spacing: 0.08em;
        line-height: 1.05;
        margin: 0 0 1rem;
        animation: rise 0.9s ease both;
      }

      .tagline {
        margin: 0 0 1.5rem;
        max-width: 28ch;
        color: var(--muted);
        font-size: clamp(1.05rem, 2.4vw, 1.25rem);
        animation: rise 1s ease 0.08s both;
      }

      form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 0.6rem;
        animation: rise 1.05s ease 0.14s both;
      }

      .hint {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.9rem;
        animation: rise 1.05s ease 0.16s both;
      }

      .hint strong {
        color: var(--accent);
        font-weight: 600;
      }

      input,
      button {
        font: inherit;
        border-radius: 0;
      }

      input {
        flex: 1 1 180px;
        min-width: 0;
        padding: 0.85rem 0.95rem;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        outline: none;
      }

      input:focus {
        border-color: rgba(226, 179, 106, 0.65);
      }

      button {
        padding: 0.85rem 1.25rem;
        color: #1a1208;
        background: var(--accent);
        border: 1px solid var(--accent);
        cursor: pointer;
        transition: transform 160ms ease, filter 160ms ease;
      }

      button:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.55;
        cursor: wait;
        transform: none;
      }

      .preview-wrap {
        margin-top: 1.25rem;
        animation: rise 1.1s ease 0.2s both;
      }

      .preview-wrap img {
        display: block;
        width: min(100%, 600px);
        height: auto;
        border: 1px solid var(--line);
      }

      .embed {
        margin-top: 1.25rem;
        max-width: 600px;
        padding: 1rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.95rem;
        animation: rise 1.15s ease 0.26s both;
      }

      .embed code {
        display: block;
        margin-top: 0.6rem;
        padding: 0.85rem;
        overflow-x: auto;
        color: var(--ink);
        background: rgba(0, 0, 0, 0.28);
        white-space: pre;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8rem;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="brand">Developer Zodiac</h1>
      <p class="tagline">Your coding personality written in the stars.</p>

      <form id="form">
        <input
          id="username"
          name="username"
          type="text"
          placeholder="GitHub username"
          autocomplete="username"
          required
        />
        <input
          id="birthdate"
          name="birthdate"
          type="text"
          inputmode="numeric"
          placeholder="YYYY-MM-DD"
          pattern="\d{4}-\d{2}-\d{2}"
          maxlength="10"
          title="Optional birthdate (YYYY-MM-DD)"
          autocomplete="bday"
        />
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Display name"
          maxlength="32"
        />
        <input
          id="role"
          name="role"
          type="text"
          placeholder="Role"
          maxlength="40"
        />
        <button id="submit" type="submit">Generate</button>
      </form>
      <p class="hint">
        Name and role are <strong>auto-estimated</strong>, then filled into the fields.
        Keep them as-is, or edit — only overrides are added to the README URL.
      </p>

      <div class="preview-wrap">
        <img id="card" alt="Developer Zodiac card preview" width="360" height="192" />
      </div>

      <div class="embed">
        Paste into your README
        <code id="markdown"></code>
      </div>
    </main>
    <script>
      const form = document.getElementById("form");
      const img = document.getElementById("card");
      const md = document.getElementById("markdown");
      const submitBtn = document.getElementById("submit");
      const usernameInput = document.getElementById("username");
      const birthInput = document.getElementById("birthdate");
      const roleInput = document.getElementById("role");
      const nameInput = document.getElementById("name");

      /** Auto defaults from GitHub; used to decide whether to bake overrides into the embed URL */
      let auto = { name: "", role: "" };

      /** Accept YYYY-MM-DD only (English numeric form). Empty is fine. */
      function normalizeBirthdate(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
          throw new Error("Birthdate must be YYYY-MM-DD");
        }
        return raw;
      }

      function buildCardPath({ username, birthdate, name, role }) {
        const params = new URLSearchParams({ username });
        if (birthdate) params.set("birthdate", birthdate);

        // Only send overrides when the user changed the auto-estimated values
        if (name && name !== auto.name) params.set("name", name);
        if (role && role !== auto.role) params.set("role", role);

        return `/api/card?${params.toString()}`;
      }

      function renderPreview(opts) {
        const path = buildCardPath(opts);
        const absolute = `${location.origin}${path}`;
        img.src = `${path}&t=${Date.now()}`;
        md.textContent = `![Developer Zodiac](${absolute})`;
      }

      async function loadDefaults(username, birthdate) {
        const params = new URLSearchParams({ username });
        if (birthdate) params.set("birthdate", birthdate);
        const res = await fetch(`/api/profile?${params.toString()}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load profile");
        return data;
      }

      async function generate() {
        const username = usernameInput.value.trim();
        if (!username) return;

        submitBtn.disabled = true;
        try {
          const birthdate = normalizeBirthdate(birthInput.value);
          const data = await loadDefaults(username, birthdate);
          auto = { name: data.name || data.username, role: data.role || "" };

          // Prefill editable fields with auto estimates (user can change after)
          nameInput.value = auto.name;
          roleInput.value = auto.role;

          renderPreview({
            username: data.username,
            birthdate,
            name: nameInput.value.trim(),
            role: roleInput.value.trim(),
          });
        } catch (err) {
          md.textContent = `Error: ${err.message}`;
        } finally {
          submitBtn.disabled = false;
        }
      }

      // Live update when user edits name/role after auto-fill
      function onEdit() {
        const username = usernameInput.value.trim();
        if (!username || !auto.role) return;
        try {
          renderPreview({
            username,
            birthdate: normalizeBirthdate(birthInput.value),
            name: nameInput.value.trim(),
            role: roleInput.value.trim(),
          });
        } catch (err) {
          md.textContent = `Error: ${err.message}`;
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        generate();
      });

      nameInput.addEventListener("change", onEdit);
      roleInput.addEventListener("change", onEdit);
      nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          onEdit();
        }
      });
      roleInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          onEdit();
        }
      });

      usernameInput.value = "seuthootDev";
      generate();
    </script>
  </body>
</html>
