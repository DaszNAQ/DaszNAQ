name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # chạy mỗi ngày lúc 00:00 UTC
  workflow_dispatch:       # cho phép chạy thủ công
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%230a3d91&color_dots=%23ebedf0,%23bfdbfe,%2360a5fa,%232563eb,%231e3a8a
            dist/github-snake-dark.svg?color_snake=%2338bdf8&color_dots=%23161b22,%231e3a8a,%232563eb,%2360a5fa,%23bae6fd
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
